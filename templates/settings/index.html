{% extends 'base.html' %}
{% block title %}Settings{% endblock %}

{% block content %}
<div class="page-header">
  <div class="breadcrumb"><a href="{{ url_for('dashboard.index') }}">Home</a> <i class="bi bi-chevron-right"></i> Settings</div>
  <h1 class="page-title">Settings</h1>
</div>

<div class="layout-2-col">
  <!-- Library Settings -->
  <div class="card">
    <div class="card-header">
      <span class="card-title"><i class="bi bi-building"></i> Library Settings</span>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('settings.index') }}" data-validate>
        <input type="hidden" name="action" value="library">
        <div class="form-group">
          <label class="form-label">Library Name</label>
          <input type="text" class="form-control" name="library_name" value="{{ settings.library_name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" name="library_address" value="{{ settings.library_address }}">
        </div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="library_email" value="{{ settings.library_email }}">
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="library_phone" value="{{ settings.library_phone }}">
          </div>
        </div>
        <div class="settings-section-title"><i class="bi bi-sliders"></i> Borrowing Rules</div>
        <div class="form-grid-3">
          <div class="form-group">
            <label class="form-label">Fine Per Day (₹)</label>
            <input type="number" class="form-control" name="fine_per_day" value="{{ settings.fine_per_day }}" min="0" step="0.5">
          </div>
          <div class="form-group">
            <label class="form-label">Max Books/Member</label>
            <input type="number" class="form-control" name="max_books_per_member" value="{{ settings.max_books_per_member }}" min="1" max="20">
          </div>
          <div class="form-group">
            <label class="form-label">Default Borrow Days</label>
            <input type="number" class="form-control" name="default_borrow_days" value="{{ settings.default_borrow_days }}" min="1" max="90">
          </div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Library Settings</button>
      </form>
    </div>
  </div>

  <!-- Profile Settings -->
  <div class="card">
    <div class="card-header">
      <span class="card-title"><i class="bi bi-person"></i> My Profile</span>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('settings.index') }}" data-validate>
        <input type="hidden" name="action" value="profile">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="name" value="{{ current_user.name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" name="email" value="{{ current_user.email }}" required>
        </div>
        <div class="settings-section-title"><i class="bi bi-shield-lock"></i> Change Password</div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" name="new_password" placeholder="Leave blank to keep current">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" name="confirm_password" placeholder="Confirm new password">
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Update Profile</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
