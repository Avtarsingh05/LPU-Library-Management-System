<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile - {{ library_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .onboarding-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .onboarding-header {
      background: var(--primary);
      color: white;
      padding: 2rem;
      text-align: center;
    }
    .onboarding-body {
      padding: 2rem;
    }
  </style>
</head>
<body>

<div class="onboarding-card">
  <div class="onboarding-header">
    <h3 class="mb-1">Welcome, {{ current_user.name.split()[0] }}! 👋</h3>
    <p class="mb-0 text-white-50">Just a few more details to set up your library account.</p>
  </div>
  
  <div class="onboarding-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.onboarding') }}">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Phone Number *</label>
          <input type="text" class="form-control" name="phone" required placeholder="e.g. +91 9876543210" value="{{ member.phone or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Department *</label>
          <select class="form-select" name="department" required>
            <option value="">Select Department...</option>
            {% for d in departments %}
            <option value="{{ d }}" {% if member.department == d %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Course / Program *</label>
          <input type="text" class="form-control" name="course" required placeholder="e.g. B.Tech" value="{{ member.course or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Semester / Year</label>
          <input type="text" class="form-control" name="semester" placeholder="e.g. 3rd Semester" value="{{ member.semester or '' }}">
        </div>
      </div>
      
      <div class="mb-4">
        <label class="form-label">Address</label>
        <textarea class="form-control" name="address" rows="2" placeholder="Hostel or Local Address">{{ member.address or '' }}</textarea>
      </div>
      
      <div class="d-grid">
        <button type="submit" class="btn btn-primary" style="background-color: var(--primary); border: none; padding: 0.75rem; font-weight: 600;">Complete Registration</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
