{% extends 'base.html' %}
{% block title %}Edit Member{% endblock %}

{% block content %}
<div class="page-header">
  <div class="breadcrumb">
    <a href="{{ url_for('dashboard.index') }}">Home</a> <i class="bi bi-chevron-right"></i>
    <a href="{{ url_for('members.index') }}">Members</a> <i class="bi bi-chevron-right"></i>
    <a href="{{ url_for('members.view', id=member.id) }}">{{ member.name }}</a> <i class="bi bi-chevron-right"></i> Edit
  </div>
  <h1 class="page-title">Edit Member</h1>
</div>

<div class="card" style="max-width:900px;">
  <div class="card-header">
    <span class="card-title"><i class="bi bi-pencil"></i> Edit: {{ member.name }}</span>
    <span class="badge badge-info">{{ member.member_id }}</span>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('members.edit', id=member.id) }}" data-validate>
      <div class="settings-section-title"><i class="bi bi-person"></i> Personal Details</div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" class="form-control" name="name" value="{{ member.name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" class="form-control" name="email" value="{{ member.email }}" required>
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" name="phone" value="{{ member.phone or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" name="address" value="{{ member.address or '' }}">
        </div>
      </div>

      <div class="settings-section-title" style="margin-top:1rem;"><i class="bi bi-mortarboard"></i> Academic Details</div>
      <div class="form-grid-3">
        <div class="form-group">
          <label class="form-label">Department</label>
          <select class="form-select" name="department">
            <option value="">Select department...</option>
            {% for dept in departments %}
            <option value="{{ dept }}" {% if member.department == dept %}selected{% endif %}>{{ dept }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Course</label>
          <input type="text" class="form-control" name="course" value="{{ member.course or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label">Semester</label>
          <input type="text" class="form-control" name="semester" value="{{ member.semester or '' }}">
        </div>
      </div>

      <div class="settings-section-title" style="margin-top:1rem;"><i class="bi bi-toggle-on"></i> Account Status</div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" name="status" style="max-width:200px;">
          <option value="active" {% if member.status == 'active' %}selected{% endif %}>Active</option>
          <option value="inactive" {% if member.status == 'inactive' %}selected{% endif %}>Inactive</option>
          <option value="suspended" {% if member.status == 'suspended' %}selected{% endif %}>Suspended</option>
        </select>
      </div>

      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <a href="{{ url_for('members.view', id=member.id) }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
