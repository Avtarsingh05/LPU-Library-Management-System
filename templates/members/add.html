{% extends 'base.html' %}
{% block title %}Add Member{% endblock %}

{% block content %}
<div class="page-header">
  <div class="breadcrumb">
    <a href="{{ url_for('dashboard.index') }}">Home</a> <i class="bi bi-chevron-right"></i>
    <a href="{{ url_for('members.index') }}">Members</a> <i class="bi bi-chevron-right"></i> Add Member
  </div>
  <h1 class="page-title">Add New Member</h1>
</div>

<div class="card" style="max-width:900px;">
  <div class="card-header">
    <span class="card-title"><i class="bi bi-person-plus"></i> Member Information</span>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('members.add') }}" data-validate>
      <div class="settings-section-title"><i class="bi bi-person"></i> Personal Details</div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Full Name <span class="required">*</span></label>
          <input type="text" class="form-control" name="name" value="{{ form_data.get('name', '') }}" required placeholder="Full name">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" class="form-control" name="email" value="{{ form_data.get('email', '') }}" required placeholder="student@university.edu">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" name="phone" value="{{ form_data.get('phone', '') }}" placeholder="+91-9876543210">
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" name="address" value="{{ form_data.get('address', '') }}" placeholder="Full address">
        </div>
      </div>

      <div class="settings-section-title" style="margin-top:1rem;"><i class="bi bi-mortarboard"></i> Academic Details</div>
      <div class="form-grid-3">
        <div class="form-group">
          <label class="form-label">Department</label>
          <select class="form-select" name="department">
            <option value="">Select department...</option>
            {% for dept in departments %}
            <option value="{{ dept }}" {% if form_data.get('department') == dept %}selected{% endif %}>{{ dept }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Course</label>
          <input type="text" class="form-control" name="course" value="{{ form_data.get('course', '') }}" placeholder="e.g. B.Tech CSE">
        </div>
        <div class="form-group">
          <label class="form-label">Semester</label>
          <input type="text" class="form-control" name="semester" value="{{ form_data.get('semester', '') }}" placeholder="e.g. 4th Semester">
        </div>
      </div>

      <div class="settings-section-title" style="margin-top:1rem;"><i class="bi bi-shield-lock"></i> Login Account (Optional)</div>
      <div style="background:#f8f9fa; padding:1rem; border-radius:8px; margin-bottom:1.25rem;">
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label class="check-label">
            <input type="checkbox" name="create_account" id="createAccountCheck" value="on" {% if form_data.get('create_account') %}checked{% endif %}>
            Create a login account for this member
          </label>
        </div>
        <div id="passwordField" style="display:{% if form_data.get('create_account') %}block{% else %}none{% endif %};">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Set a password for the member">
          </div>
        </div>
      </div>

      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <a href="{{ url_for('members.index') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add Member</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('createAccountCheck').addEventListener('change', function() {
  document.getElementById('passwordField').style.display = this.checked ? 'block' : 'none';
});
</script>
{% endblock %}
