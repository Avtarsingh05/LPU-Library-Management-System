{% extends 'base.html' %}
{% block title %}Too Many Requests{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; justify-content:center; min-height:60vh; text-align:center;">
  <div>
    <div style="font-size: 5rem; color: #e74c3c;"><i class="bi bi-shield-lock"></i></div>
    <h1 style="font-size: 2.5rem; font-weight: 700; color: #2c3e50; margin-bottom: 1rem;">429</h1>
    <h2 style="font-size: 1.5rem; color: #34495e; margin-bottom: 1rem;">Too Many Requests</h2>
    <p style="color: #7f8c8d; max-width: 500px; margin: 0 auto 2rem;">
      {{ error.description if error else 'You have exceeded the rate limit for this action. Please wait a moment and try again.' }}
    </p>
    <button onclick="window.history.back()" class="btn btn-primary">Go Back</button>
  </div>
</div>
{% endblock %}
