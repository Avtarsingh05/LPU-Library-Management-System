<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; background: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .error-page { text-align: center; padding: 2rem; }
    .error-code { font-size: 6rem; font-weight: 700; color: #dee2e6; line-height: 1; }
    .error-icon { font-size: 3rem; color: #f39c12; margin-bottom: 1rem; }
    h2 { font-size: 1.5rem; color: #2c3e50; margin-bottom: 0.5rem; }
    p { color: #6c757d; margin-bottom: 1.5rem; }
    a { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.6rem 1.25rem; background: #2980b9; color: white; border-radius: 8px; text-decoration: none; font-weight: 500; }
    a:hover { background: #2471a3; }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <div class="error-code">500</div>
    <h2>Something Went Wrong</h2>
    <p>An internal server error occurred. Please try again later.</p>
    <a href="/"><i class="bi bi-house"></i> Back to Home</a>
  </div>
</body>
</html>
