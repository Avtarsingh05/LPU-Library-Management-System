{% extends 'base.html' %}
{% block title %}Add Library{% endblock %}

{% block content %}
<div class="page-header">
  <div class="d-flex align-center justify-between">
    <div>
      <h1 class="page-title">Add Library</h1>
      <p class="page-subtitle">Create a new library branch.</p>
    </div>
    <a href="{{ url_for('libraries.index') }}" class="btn btn-outline-secondary">Back to Libraries</a>
  </div>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="name">Library Name *</label>
        <input type="text" id="name" name="name" class="form-control" required placeholder="e.g. Central Library">
      </div>
      <div class="form-group">
        <label class="form-label" for="code">Library Code *</label>
        <input type="text" id="code" name="code" class="form-control" required placeholder="e.g. LIB001">
      </div>
      <div class="form-group">
        <label class="form-label" for="description">Description</label>
        <textarea id="description" name="description" class="form-control" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="address">Address</label>
        <textarea id="address" name="address" class="form-control" rows="2"></textarea>
      </div>
      
      <div class="mt-4 text-end">
        <button type="submit" class="btn btn-primary">Create Library</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
